[Service]
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
NoNewPrivileges=yes
MemoryDenyWriteExecute=yes
RuntimeDirectory=apache2
RestrictNamespaces=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectHome=yes
ProtectHostname=yes
ProtectClock=yes
ProtectProc=invisible
ProcSubset=pid
ReadWritePaths=/etc/apache2 /var/run/apache2/ /var/www/ /var/log/apache2/ /run/apache2/
LockPersonality=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@clock @module @raw-io @reboot @swap @resources _sysctl acct bpf capset chroot fanotify_init fanotify_mark nfsservctl open_by_handle_at pivot_root quotactl quotactl_fd setdomainname setfsuid setfsuid32 setgroups setgroups32 sethostname setresuid setresuid32 setreuid setreuid32 setuid setuid32 vhangup
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_CHOWN CAP_DAC_READ_SEARCH
RemoveIPC=yes